# All persistent state lives under one directory, OTA_DATA_ROOT, as bind mounts
# rather than Docker named volumes. On an SD card today; when an NVMe arrives,
# migration is "copy that one directory and repoint the variable" instead of
# relocating Docker's data root. See ota-infra/docs/storage.md.
name: ota-server

services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      OTA_DB_PATH: /srv/ota/db/ota.db
      OSTREE_REPO_PATH: /srv/ota/repo
      REPO_PUBLIC_URL: ${REPO_PUBLIC_URL:-http://localhost:8080/repo}
    volumes:
      - ${OTA_DATA_ROOT:-/srv/ota}/repo:/srv/ota/repo
      - ${OTA_DATA_ROOT:-/srv/ota}/db:/srv/ota/db
    ports: ["8000:8000"]
    restart: unless-stopped

  repo:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Read-only: nginx serves the repo, only the API and CI write to it.
      - ${OTA_DATA_ROOT:-/srv/ota}/repo:/srv/ostree-repo:ro
    ports: ["8080:8080"]
    depends_on: [api]
    restart: unless-stopped

  # One-shot: create the archive repo the first time. `archive` mode is required
  # for a repo served over HTTP -- objects are individually compressed files.
  repo-init:
    image: debian:bookworm-slim
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq ostree &&
               [ -d /srv/ota/repo/objects ] ||
               ostree init --repo=/srv/ota/repo --mode=archive"
    volumes:
      - ${OTA_DATA_ROOT:-/srv/ota}/repo:/srv/ota/repo
    restart: "no"
