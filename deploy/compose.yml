services:
  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      DATABASE_URL: postgresql://ota:ota@db:5432/ota
      OSTREE_REPO_PATH: /srv/ostree-repo
      REPO_PUBLIC_URL: http://localhost:8080/repo
    volumes:
      - ostree-repo:/srv/ostree-repo
    depends_on: [db]
    ports: ["8000:8000"]

  repo:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ostree-repo:/srv/ostree-repo:ro
    ports: ["8080:8080", "8443:8443"]
    depends_on: [api]

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ota
      POSTGRES_PASSWORD: ota
      POSTGRES_DB: ota
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  ostree-repo:
  pgdata:
