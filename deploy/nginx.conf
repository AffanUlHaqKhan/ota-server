# Two vhost roles: static OSTree content, and the API.
# Content is content-addressed and immutable -> cache hard, CDN-friendly.

server {
    listen 8080;
    server_name _;

    # --- OSTree repo: plain static files, no app server involved -------------
    location /repo/ {
        alias /srv/ostree-repo/;
        autoindex off;

        # objects/ and deltas/ are immutable
        location ~ ^/repo/(objects|deltas)/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        # refs and summary change every publish
        location ~ ^/repo/(refs/|summary) {
            add_header Cache-Control "no-cache";
        }
    }
}

server {
    listen 8443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # --- device API: mutual TLS ---------------------------------------------
    ssl_client_certificate /etc/nginx/certs/device-ca.crt;
    ssl_verify_client      optional;   # 'on' once every device is provisioned
    ssl_verify_depth       2;

    location /api/v1/devices/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_set_header X-Device-CN $ssl_client_s_dn_cn;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_pass http://api:8000;
    }

    # --- operator API: bearer token, no client cert -------------------------
    location /api/v1/ {
        proxy_pass http://api:8000;
    }
}
