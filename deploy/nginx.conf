# Static OSTree content only. The device API's mTLS front end lives in
# nginx-tls.conf.example until a device CA exists -- see that file.
# Content is content-addressed and immutable -> cache hard, CDN-friendly.

server {
    listen 8080;
    server_name _;

    # --- OSTree repo: plain static files, no app server involved -------------
    location /repo/ {
        alias /srv/ostree-repo/;
        autoindex off;

        # objects/ and deltas/ are immutable
        location ~ ^/repo/(objects|deltas)/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
        # refs and summary change every publish
        location ~ ^/repo/(refs/|summary) {
            add_header Cache-Control "no-cache";
        }
    }
}
